<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Gene Coverage Metrics</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .header-wrapper {
      background-color: white; position: relative; z-index: 2; height: 150px;
      box-sizing: border-box; display: flex; align-items: center; padding: 0 30px;
    }
    .logo img { width: 200px; height: auto; margin-right: 10px; }
    .logotext { color: black; font-weight: bold; font-size: 18px; }
    .container { text-align: center; margin-top: 20px; }
    .controls {
      margin: 20px auto; max-width: 800px; display: flex; gap: 10px;
      justify-content: center; align-items: center; flex-wrap: wrap;
    }
    input[type="text"] {
      padding: 8px 12px; font-size: 14px; border: 1px solid #ccc;
      border-radius: 4px; min-width: 300px;
    }
    button {
      padding: 8px 16px; background-color: orangered; color: white;
      border: none; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    button:hover { background-color: #cc5500; }
    .table-wrapper {
      max-height: 700px; overflow-y: auto; border: 1px solid #ccc;
      margin: 0 auto; width: 60%;
    }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #000000; padding: 8px; font-weight: 100; font-size: 14px; text-align: center; }
    th { background-color: orangered; color: white; position: sticky; top: 0; cursor: pointer; }
    @media only screen and (max-width: 600px) {
      .table-wrapper { width: 95%; }
      table { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="header-wrapper">
    <div class="logo">
      <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAT0AAABtCAYAAADTYrbeAAAABHNCSVQICAgIfAhkiAAAABl0RVh0U29mdHdhcmUAZ25vbWUtc2NyZWVuc2hvdO8Dvz4AACAASURBVHic7Z13eFRV+sc/507KpPeQRhJIQggJJRA6En[...]" alt="logo"/>
    </div>
    <div class="logotext">Gene Coverage Metrics</div>
  </div>
  <div class="container">
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search by Gene..." />
      <button onclick="sortTable(true)">Sort Ascending</button>
      <button onclick="sortTable(false)">Sort Descending</button>
      <button id="downloadBtn">Download CSV</button>
    </div>
    <div class="table-wrapper">
      <table id="dataTable">
        <thead>
          <tr><th>S.No</th><th>Gene</th><th>Percentage of coding region covered</th></tr>
        </thead>
        <tbody id="tbody"><tr><td>1</td><td>A1BG</td><td>100.0</td></tr>
<tr><td>2</td><td>A1CF</td><td>100.0</td></tr>
<tr><td>3</td><td>A2M</td><td>99.5391</td></tr>
<tr><td>4</td><td>A2ML1</td><td>100.0</td></tr>
<tr><td>5</td><td>A3GALT2</td><td>100.0</td></tr>
<!-- (rest of table rows truncated for brevity in the editor) -->
</tbody>
      </table>
    </div>
  </div>

  <script>
  // Client-side deduplication + search, sort, and CSV download
  (function(){
    const tbody = document.getElementById('tbody');
    if (!tbody) return;

    // Parse existing rows and pick the row with the highest percentage per gene
    const rows = Array.from(tbody.querySelectorAll('tr'));
    const best = new Map(); // preserves insertion order

    rows.forEach(row => {
      const cells = row.children;
      if (cells.length < 3) return;
      const pathText = cells[1].textContent.trim();
      // gene may be "MT-TY/MT-TY/EX1" or just "MT-TY"; take the first segment
      const gene = pathText.split('/')[0];
      const perc = parseFloat(cells[2].textContent.trim()) || 0;
      if (!best.has(gene) || perc > best.get(gene).perc) {
        best.set(gene, { perc });
      }
    });

    function rebuildTable(sortedEntries) {
      tbody.innerHTML = '';
      let i = 1;
      (sortedEntries || Array.from(best.entries())).forEach(([gene, val]) => {
        const tr = document.createElement('tr');
        const percText = Number.isFinite(val.perc) ? String(val.perc) : '';
        tr.innerHTML = `<td>${i++}</td><td>${gene}</td><td>${percText}</td>`;
        tbody.appendChild(tr);
      });
    }

    // Initial rebuild to deduplicate
    rebuildTable();

    // Search functionality
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', function(){
      const q = this.value.trim().toLowerCase();
      const entries = Array.from(best.entries()).filter(([gene]) => gene.toLowerCase().includes(q));
      rebuildTable(entries);
    });

    // Sorting: by percentage (numeric). ascending=true for ascending
    window.sortTable = function(ascending){
      const entries = Array.from(best.entries());
      entries.sort((a,b) => {
        const pa = parseFloat(a[1].perc) || 0;
        const pb = parseFloat(b[1].perc) || 0;
        // if percentages equal, sort by gene name
        if (pa === pb) return a[0].localeCompare(b[0]);
        return ascending ? pa - pb : pb - pa;
      });
      rebuildTable(entries);
    };

    // CSV download of currently displayed rows
    function tableToCSV() {
      const rows = Array.from(tbody.querySelectorAll('tr'));
      const lines = ['S.No,Gene,Percentage of coding region covered'];
      rows.forEach(r => {
        const cells = Array.from(r.children).map(c => '"' + c.textContent.trim().replace(/"/g,'""') + '"');
        lines.push(cells.join(','));
      });
      return lines.join('\n');
    }

    document.getElementById('downloadBtn').addEventListener('click', function(){
      const csv = tableToCSV();
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'gene_coverage_by_gene.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

  })();
  </script>
</body>
</html>
